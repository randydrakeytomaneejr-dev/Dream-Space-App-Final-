<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt — Dream Space</title>
<style>
  :root{ --bg:#0F0E0C; --ink:#F2EEE6; --sub:#A79E8E; --line:#2A271F; --accent:#2FA8A0; --gold:#C9A25A; --card:#17150F; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:2rem 1.5rem; }
  .serif{font-family:'Iowan Old Style',Georgia,serif;}
  .box{ max-width:480px; margin:0 auto; }
  .back{display:inline-block; margin-bottom:1.5rem; color:var(--sub); text-decoration:none; font-size:.85rem;}
  .loading, .error{color:var(--sub); font-size:.9rem;}
  .error{color:#E27D5A;}

  .receipt{ display:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.8rem; }
  .receipt.show{display:block;}
  .r-brand{display:flex; align-items:center; gap:.6rem; margin-bottom:1.4rem;}
  .r-mark{width:28px; height:28px; border:1.5px solid var(--accent); border-radius:6px; position:relative; flex-shrink:0;}
  .r-mark::after{content:''; position:absolute; inset:5px; border:1.5px solid var(--gold); border-radius:3px;}
  .r-brand-name{font-weight:600; font-size:1.05rem;}
  .r-brand-sub{font-size:.62rem; color:var(--sub); letter-spacing:.03em;}

  .r-meta{font-size:.82rem; color:var(--sub); margin-bottom:1.2rem; line-height:1.6;}
  .r-meta b{color:var(--ink);}
  .r-status{ display:inline-block; background:var(--accent); color:#08201E; padding:.25rem .7rem;
    border-radius:20px; font-size:.75rem; font-weight:600; text-transform:capitalize; }

  table{width:100%; border-collapse:collapse; margin:1rem 0;}
  td{padding:.5rem 0; font-size:.88rem; border-bottom:1px solid var(--line);}
  td.amt{text-align:right;}
  .total-row td{border-bottom:none; border-top:1px solid var(--line); font-weight:700; padding-top:.8rem;}

  .pay-note{font-size:.8rem; color:var(--sub); margin-top:1rem; line-height:1.5;}
  .pay-note b{color:var(--gold);}

  .actions{display:flex; gap:.6rem; margin-top:1.6rem;}
  button{ flex:1; padding:.75rem; border:none; border-radius:7px; background:var(--accent);
    color:#08201E; font-weight:600; cursor:pointer; font-size:.88rem; }
  button.ghost{background:none; border:1px solid var(--line); color:var(--ink);}

  @media print {
    .back, .actions { display:none !important; }
    body{background:#fff; color:#000; padding:0;}
    .receipt{border:none; background:#fff;}
    .r-meta, td{color:#000;}
  }
</style>
</head>
<body>
<div class="box">
  <a class="back" href="/track.html">← Back to order tracking</a>
  <div class="loading" id="loading">Loading receipt…</div>
  <p class="error" id="errorNote" style="display:none;"></p>

  <div class="receipt" id="receipt">
    <div class="r-brand">
      <div class="r-mark"></div>
      <div>
        <div class="r-brand-name">DREAM SPACE</div>
        <div class="r-brand-sub">ALUMINUM · FURNITURE &amp; INTERIOR DESIGN</div>
      </div>
    </div>

    <div class="r-meta">
      Order <b id="rCode"></b> · <span id="rDate"></span><br>
      <span id="rCustomer"></span><br>
      <span class="r-status" id="rStatus"></span>
    </div>

    <table id="rItems"></table>

    <div class="pay-note" id="rPayNote"></div>

    <div class="actions">
      <button onclick="window.print()">Download / Print</button>
      <button class="ghost" onclick="location.href='/track.html'">Back to tracking</button>
    </div>
  </div>
</div>

<script>
async function loadReceipt(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const loading = document.getElementById('loading');
  const errorNote = document.getElementById('errorNote');

  if(!code){
    loading.style.display = 'none';
    errorNote.textContent = 'No order code given. Go back to the tracking page and open your receipt from there.';
    errorNote.style.display = 'block';
    return;
  }

  try{
    const res = await fetch('/api/receipt/' + encodeURIComponent(code));
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Receipt not available');

    document.getElementById('rCode').textContent = data.code;
    document.getElementById('rDate').textContent = new Date(data.createdAt).toLocaleString();
    document.getElementById('rCustomer').textContent =
      [data.customerName, data.customerPhone].filter(Boolean).join(' · ');
    document.getElementById('rStatus').textContent = data.status;

    const rows = data.items.map(it =>
      `<tr><td>${it.qty}x ${it.name}</td><td class="amt">$${(it.price * it.qty).toFixed(2)}</td></tr>`
    ).join('');
    document.getElementById('rItems').innerHTML = rows +
      `<tr class="total-row"><td>Total</td><td class="amt">$${data.total.toFixed(2)}</td></tr>`;

    document.getElementById('rPayNote').innerHTML =
      `Paid via <b>${data.paymentInfo.method}</b> to ${data.paymentInfo.number} (${data.paymentInfo.name}).`;

    loading.style.display = 'none';
    document.getElementById('receipt').classList.add('show');
  }catch(e){
    loading.style.display = 'none';
    errorNote.textContent = e.message;
    errorNote.style.display = 'block';
  }
}

loadReceipt();
</script>
</body>
</html>
